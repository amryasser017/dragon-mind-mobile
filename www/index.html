<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dragon Mind</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== AUTH SCREEN ===================== -->
  <section id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="auth-brand-mark" src="assets/logo-icon.svg" alt="Dragon Mind" />
        <h1>DRAGON MIND</h1>
        <p class="auth-tagline">The Art of Focus. The Power of Simplicity.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" type="button">Log in</button>
        <button class="auth-tab" data-tab="signup" type="button">Sign up</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>Email
          <input type="email" id="login-email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" id="login-password" required autocomplete="current-password" />
        </label>
        <p class="auth-error" id="login-error"></p>
        <button type="submit" class="btn btn-primary btn-block">Enter the hoard</button>
      </form>

      <form id="signup-form" class="auth-form hidden">
        <label>Email
          <input type="email" id="signup-email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" id="signup-password" required autocomplete="new-password" minlength="6" />
          <span class="field-hint">At least 6 characters</span>
        </label>
        <p class="auth-error" id="signup-error"></p>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
    </div>
  </section>

  <!-- ===================== APP SCREEN ===================== -->
  <section id="app-screen" class="app-screen hidden">

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <img class="sidebar-logo-icon" src="assets/logo-icon.svg" alt="Dragon Mind" />
        <button id="sidebar-toggle" class="icon-btn" type="button" title="Collapse sidebar" aria-label="Collapse sidebar">
          <img class="icon" src="assets/icons/open.svg" alt="" />
        </button>
      </div>

      <button id="new-folder-btn" class="btn btn-folder btn-new-folder" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5 V19 M5 12 H19" stroke-linecap="round"/></svg>
        <span class="label-text">New Folder</span>
      </button>

      <nav id="folder-list" class="folder-list"><!-- folders injected here --></nav>

      <div class="sidebar-divider"></div>

      <nav class="special-folders">
        <div class="folder-item special" data-special="done" id="folder-done">
          <div class="folder-row" role="button" tabindex="0">
            <img class="icon folder-icon" src="assets/icons/completed.svg" alt="" />
            <span class="folder-name label-text">Completed Flames</span>
            <span class="folder-count label-text" id="done-count">0</span>
          </div>
          <div class="task-list" id="tasks-done"></div>
        </div>

        <div class="folder-item special" data-special="deleted" id="folder-deleted">
          <div class="folder-row" role="button" tabindex="0">
            <img class="icon folder-icon" src="assets/icons/trash-folder.svg" alt="" />
            <span class="folder-name label-text">Trash</span>
            <span class="folder-count label-text" id="deleted-count">0</span>
          </div>
          <div class="task-list" id="tasks-deleted"></div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">?</div>
          <span class="user-email label-text" id="user-email-label"></span>
        </div>
        <div class="sidebar-footer-actions">
          <button id="settings-btn" class="icon-btn" type="button" title="Settings" aria-label="Settings">
            <img class="icon" src="assets/icons/settings.svg" alt="" />
          </button>
          <button id="logout-btn" class="icon-btn" type="button" title="Log out" aria-label="Log out">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#DA5C53" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <div id="sidebar-expand-catcher" class="sidebar-expand-catcher hidden"></div>

    <main class="main-content">
      <header class="main-header">
        <img class="main-logo" src="assets/logo-full.svg" alt="Dragon Mind" />
        <div class="search-box">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21 L16.65 16.65" stroke-linecap="round"/></svg>
          <input type="text" id="search-input" placeholder="Search flames" />
        </div>
        <button id="logout-btn-top" class="btn btn-accent-outline signout-btn" type="button">Sign Out</button>
      </header>

      <div class="top-buttons">
        <button id="new-folder-btn-2" class="btn btn-folder" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5 V19 M5 12 H19" stroke-linecap="round"/></svg>
          New Folder
        </button>
        <button id="new-task-btn" class="btn btn-flame" type="button">
          <img class="icon" src="assets/icons/flame.svg" alt="" />
          New Flame
        </button>
      </div>

      <div id="empty-state" class="empty-state">
        <img src="assets/logo-icon.svg" alt="" />
        <h2>Pick a folder, or forge a new one</h2>
        <p>Select a folder from the left to see its flames, or create a folder to start hoarding.</p>
      </div>

      <div id="folder-view" class="folder-view hidden">
        <header class="folder-view-header">
          <h2 id="active-folder-title">Folder</h2>
        </header>
        <div id="folder-view-tasks" class="folder-view-tasks"></div>
      </div>
    </main>
  </section>

  <!-- ===================== TASK (FLAME) MODAL ===================== -->
  <div id="task-modal-overlay" class="modal-overlay hidden">
    <div id="task-modal" class="task-modal">
      <input id="task-title-input" class="task-title-input" type="text" placeholder="Flame title" maxlength="255" />
      <textarea id="task-desc-input" class="task-desc-input" placeholder="Flame content (optional)"></textarea>
      <p class="task-modal-error" id="task-modal-error"></p>
      <div class="task-modal-actions">
        <button id="task-discard-btn" class="btn btn-accent-outline" type="button">Discard</button>
        <button id="task-save-btn" class="btn btn-primary" type="button">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
